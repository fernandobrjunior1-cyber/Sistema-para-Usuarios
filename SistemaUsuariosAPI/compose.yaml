
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sistema-usuarios-api-compose

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: ${DB_CONNECTION}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES}

  angular:
    build:
      context: ../SistemaUsuariosAngular
      dockerfile: Dockerfile

    container_name: sistema-usuarios-angular-compose

    ports:
      - "4000:4000"

    environment:
      NODE_ENV: production
      PORT: "4000"
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1"

    depends_on:
      - api
